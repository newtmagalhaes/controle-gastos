name: CI/CD

on:
  pull_request:
    branches: [main]

permissions:
  # Allows the action to publish new comments directly on trusted PRs.
  # Forked pull_request runs are downgraded to read-only by GitHub.
  pull-requests: write
  # Allows updating the python-coverage-comment-action branch and editing
  # existing comments when direct publication is allowed.
  contents: write

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: pip install --requirement requirements.txt --no-cache-dir --disable-pip-version-check

      - name: Run tests
        run: |
          cd src/
          pytest --cov
        env:
          CI: True

      - name: Get coverage
        id: coverage_comment
        uses: py-cov-action/python-coverage-comment-action@v3
        env:
          ACTIONS_STEP_DEBUG: true
        with:
          ANNOTATE_MISSING_LINES: true
          COMMENT_ARTIFACT_NAME: ci/actions/py-cov-pr-comment
          COMMENT_FILENAME: py-cov-comment.txt
          COVERAGE_PATH: src/
          GITHUB_TOKEN: ${{ github.token }}

      - name: Store Pull Request comment to be posted
        uses: actions/upload-artifact@v7.0.1
        if: steps.coverage_comment.outputs.COMMENT_FILE_WRITTEN == 'true'
        with:
          # If you use a different name, update COMMENT_ARTIFACT_NAME accordingly
          name: ci/actions/py-cov-pr-comment
          # If you use a different name, update COMMENT_FILENAME accordingly
          path: |
            src/*coverage
            src/py-cov-comment.txt
          include-hidden-files: true
