<div class="container" style="height: 300px;">
    <canvas id="{{ chart.id }}"></canvas>

    {% with data_id='data_'|add:chart.id %}

    {{ chart.data|json_script:data_id}}

    <script>
        new Chart(
            document.getElementById('{{ chart.id }}'),
            JSON.parse(document.getElementById('{{ data_id }}').textContent),
        )
    </script>
    {% endwith %}
</div>
