{% load static %}
<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="auto">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de gastos</title>

    <script src="{% static 'core/toogle_theme.js' %}"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <nav class="navbar sticky-top">
        <div class="btn-group" role="group" aria-label="toogle theme">
            <input type="radio" class="btn-check" name="theme" id="theme_light">
            <label class="btn btn-outline-secondary" for="theme_light" data-bs-theme-value="light">light</label>

            <input type="radio" class="btn-check" name="theme" id="theme_dark">
            <label class="btn btn-outline-secondary" for="theme_dark" data-bs-theme-value="dark">dark</label>
        </div>
    </nav>

    <main class="container text-center">
        {% block content %}
        <h1>Adicione o conteúdo aqui</h1>
        {% endblock content %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
