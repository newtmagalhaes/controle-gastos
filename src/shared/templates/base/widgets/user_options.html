{% if user.is_anonymous %}
<a href="{% url "login" %}" class="btn btn-outline-success">
    <i class="bi bi-door-open"></i>
    <span>Login</span>
</a>
{% else %}
<div class="dropdown">
    <button class="btn btn-link nav-link px-0 px-lg-2 py-2 dropdown-toggle d-flex align-items-center show" type="button" data-bs-toggle="dropdown">
        <i class="bi bi-person"></i>
        <span class="ms-2" id="bd-theme-text">{{ user.username }}</span>
    </button>

    <ul class="dropdown-menu p-1 row-gap-1" data-bs-popper="static">
        {% block dropdown_menu_extra %}
        <li><a href="{% url "categorias_list" %}" class="dropdown-item">Categorias</a></li>

        {% if user.is_staff %}
        <li><hr class="dropdown-divider"></li>
        <li><a href="{% url "admin:index" %}" class="dropdown-item">Admin</a></li>
        {% endif %}
        {% endblock dropdown_menu_extra %}

        <li><hr class="dropdown-divider"></li>
        <li>
            <form class="card pl-2" action="{% url "logout" %}" method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-outline-danger" >
                    <i class="bi bi-box-arrow-right"></i>
                    <span>Logout</span>
                </button>
            </form>
        </li>
    </ul>
</div>
{% endif %}
